<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beanstalk — Across the Lap</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14181f; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8e6e3; }
  #view { position: fixed; inset: 0 320px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; box-sizing: border-box; padding: 14px 16px; overflow-y: auto; background: rgba(20,20,26,0.96); border-left: 1px solid #2c2c36; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #9aa0ac; margin: 14px 0 6px; border-bottom: 1px solid #2c2c36; padding-bottom: 3px; }
  .sub { color: #8a8a96; font-size: 11px; line-height: 1.5; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { background: #2e2e3a; color: #e8e6e3; border: 1px solid #454555; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #3a3a48; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: #6b5a2a; border-color: #c9a84c; color: #fff; }
  button.big { font-size: 14px; padding: 9px 16px; background: #4a3a1c; border-color: #c9a84c; }
  button.red { background: #5a1f24; border-color: #c24850; }
  .stepper { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .stepper span.l { width: 64px; color: #c9c9d1; } .stepper span.v { width: 40px; text-align: center; color: #c9a84c; font-variant-numeric: tabular-nums; }
  input[type=number] { width: 48px; background: #1c1c24; color: #e8e6e3; border: 1px solid #454555; border-radius: 4px; padding: 5px; }
  #meter { position: relative; height: 16px; background: #1c1c24; border: 1px solid #454555; border-radius: 4px; overflow: hidden; }
  #meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #4a7a4a, #c9a84c 60%, #c24850); }
  #meter b { position: absolute; top: 0; bottom: 0; left: 66.7%; width: 2px; background: #fff; opacity: .7; }
  #band { margin-top: 5px; font-size: 13px; } #line { margin-top: 4px; min-height: 2.6em; font-size: 12px; color: #b9b9c4; line-height: 1.4; }
  #end { margin-top: 8px; padding: 8px 10px; border: 1px solid #454555; border-radius: 4px; background: #1c1c24; font-size: 12px; line-height: 1.5; }
  @media (max-width: 760px) { #view { right: 0; bottom: 300px; } #panel { top: auto; width: 100%; height: 300px; border-left: 0; border-top: 1px solid #2c2c36; } }
</style>
</head>
<body>
<div id="view"></div>
<aside id="panel">
  <h1>Across the lap</h1>
  <div class="sub">Gerda gives, Jack receives. Drag to orbit, scroll to zoom, right-drag to pan. Space smacks.</div>

  <h3>The correction</h3>
  <div class="btns"><button id="smack" class="big">Smack</button><button id="run">Run</button><input id="runN" type="number" min="1" max="60" value="6"><button id="stop">Stop</button></div>
  <div class="btns" style="margin-top:6px"><button id="endBtn">End the correction</button><button id="red" class="red">Red</button></div>
  <div class="stepper" style="margin-top:8px"><span class="l">Pace</span><button data-s="pace" data-d="-1">−</button><span class="v" id="paceV">1.0×</span><button data-s="pace" data-d="1">+</button></div>
  <div class="stepper"><span class="l">Strength</span><button data-s="strength" data-d="-1">−</button><span class="v" id="strV">1.0×</span><button data-s="strength" data-d="1">+</button></div>

  <h3>Jack</h3>
  <div id="meter"><i id="fill"></i><b title="the edge of resistance"></b></div>
  <div id="band">Composed</div><div id="line"></div>

  <h3>Implement</h3>
  <div class="btns" id="impl"></div>
  <h3>Side</h3>
  <div class="btns" id="side"></div>
  <h3>Clothes</h3>
  <div class="btns"><button id="trousers">Trousers: up</button><button id="drawers">Drawers: up</button></div>
  <div class="sub" style="margin-top:4px">Clothing over the rear cushions the sting, not the ache.</div>
  <h3>Camera</h3>
  <div class="btns" id="cams"></div>
  <h3>Scene</h3>
  <div class="btns"><button id="clear">Clear marks</button><button id="snd" class="on">Sound</button><button id="again">Start again</button></div>
  <div id="end" hidden></div>
</aside>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="starlight-engine.js"></script>
<script src="js/blocky.js"></script>
<script src="js/lap.js"></script>
<script>
(function () {
  var L = Lap.create(document.getElementById('view')), st = L.st, $ = function (id) { return document.getElementById(id); };
  var PACE = [0.5, 0.7, 1, 1.4, 2], STR = [0.5, 0.75, 1, 1.25, 1.5], idx = { pace: 2, strength: 2 };
  function btn(box, label, fn, key) { var b = document.createElement('button'); b.textContent = label; b.dataset.k = key; b.onclick = fn; $(box).appendChild(b); return b; }
  // implements
  Object.keys(L.IMPL).forEach(function (k) { btn('impl', L.IMPL[k].name, function () { L.implement(k); mark(); }, k); });
  [['alt', 'Alternate'], ['L', 'Left'], ['R', 'Right']].forEach(function (p) { btn('side', p[1], function () { st.side = p[0]; mark(); }, p[0]); });
  [['overview', 'Overview'], ['behind', 'Behind'], ['shoulder', 'Over your shoulder'], ['face', 'Face']].forEach(function (p) { btn('cams', p[1], function () { L.view(p[0]); }, p[0]); });
  function mark() {
    document.querySelectorAll('#impl button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === st.implement); });
    document.querySelectorAll('#side button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === st.side); });
    $('trousers').textContent = 'Trousers: ' + st.trousers; $('drawers').textContent = 'Drawers: ' + st.drawers;
    $('drawers').disabled = st.trousers === 'up';
  }
  mark();
  $('smack').onclick = function () { L.smack(); };
  $('run').onclick = function () { L.run(+$('runN').value); };
  $('stop').onclick = function () { L.stop(); };
  $('endBtn').onclick = function () { L.end(); };
  $('red').onclick = function () { L.red(); };
  $('clear').onclick = function () { L.clearMarks(); };
  $('again').onclick = function () { L.reset(); $('end').hidden = true; };
  $('snd').onclick = function () { st.sound = !st.sound; $('snd').classList.toggle('on', st.sound); };
  $('trousers').onclick = function () { L.layers({ trousers: st.trousers === 'up' ? 'down' : 'up', drawers: st.trousers === 'up' ? st.drawers : st.drawers }); mark(); };
  $('drawers').onclick = function () { L.layers({ drawers: st.drawers === 'up' ? 'down' : 'up' }); mark(); };
  document.querySelectorAll('.stepper button').forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.s, t = k === 'pace' ? PACE : STR;
      idx[k] = Math.max(0, Math.min(t.length - 1, idx[k] + +b.dataset.d)); st[k] = t[idx[k]];
      $(k === 'pace' ? 'paceV' : 'strV').textContent = st[k].toFixed(1) + '×';
    };
  });
  addEventListener('keydown', function (e) { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); L.smack(); } });
  var LINES = ['Jack takes it with a grin.', 'He flinches, but keeps his grin.', 'He squirms, the grin gone.', 'He kicks and yelps, close to the edge.', 'He is past the edge now: begging, and most receptive.', 'Too harsh.'];
  L.on(function (type, d) {
    if (type === 'hit') $('line').textContent = LINES[L.bandIndex()];
    if (type === 'tooharsh') $('line').textContent = 'That is too harsh. Nothing more is struck; end the correction.';
    if (type === 'end') {
      var e = $('end'); e.hidden = false;
      e.innerHTML = d.red ? '<b>“Red.”</b> The scene stops at once; Jack is helped up. Nothing is held against him.' : '<b>Done.</b> ' + d.hits + ' smack' + (d.hits === 1 ? '' : 's') + '; he was brought as far as <b>' + L.BANDS[d.peak < 0.3 ? 0 : d.peak < 0.6 ? 1 : d.peak < 0.9 ? 2 : d.peak < 1 ? 3 : d.peak < 1.5 ? 4 : 5] + '</b>.';
    }
    if (type === 'reset') $('line').textContent = '';
  });
  var last = performance.now();
  (function loop(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t; L.update(dt);
    var i = L.info();
    $('fill').style.width = Math.min(100, i.distress / 1.5 * 100) + '%';
    $('band').innerHTML = 'Distress <b>' + i.distress.toFixed(2) + '</b> — ' + i.band + ' · ' + i.hits + ' smack' + (i.hits === 1 ? '' : 's');
    mark();
    $('smack').disabled = !L.canStrike() || i.busy; $('run').disabled = !L.canStrike(); $('stop').disabled = !i.running;
    $('endBtn').disabled = i.ended; $('red').disabled = i.ended;
    requestAnimationFrame(loop);
  })(last);
  window.__lap = L;
})();
</script>
</body>
</html>
