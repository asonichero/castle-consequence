<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night scene — free camera</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; color: #ece8df; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: fixed; inset: 0; } #stage canvas { display: block; }
  #fade { display: none; }
  #subs { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(780px, 92vw); display: none; z-index: 20; background: rgba(8,8,12,0.78); border: 1px solid #4a4d58; border-radius: 8px; padding: 12px 18px 14px; font-size: clamp(15px, 2.2vw, 20px); line-height: 1.5; pointer-events: none; }
  #subWho { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; } #subText { min-height: 1.5em; }
  #subGate, #subChoices { display: none; }
  #hud { position: fixed; left: 12px; top: 10px; z-index: 30; font-size: 12px; background: rgba(10,12,16,.7); border: 1px solid #3a3d48; border-radius: 6px; padding: 6px 10px; line-height: 1.6; }
  #hud b { color: #e6c46a; } #hud select, #hud button { font: inherit; background: #1a1d26; color: #c9b87a; border: 1px solid #4a4d58; border-radius: 4px; padding: 1px 6px; cursor: pointer; }
  #state { position: fixed; right: 14px; top: 10px; z-index: 30; font-size: 22px; opacity: .8; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>
<div id="subs"><div id="subWho"></div><div id="subText"></div><button id="subGate">Continue</button><div id="subChoices"></div></div>
<div id="state">▶</div>
<div id="hud">
  <b>Esc</b> or <b>P</b> pause / play · <b>Space</b> next line · <b>drag</b> orbit · <b>right-drag</b> pan · <b>wheel</b> zoom · <b>R</b> reset view<br>
  Version: <select id="tier"><option value="0,2,0">Brash</option><option value="1,0,1">Cheeky</option><option value="2,1,2">Humble</option></select>
  <button id="restart">Restart</button> <span id="where"></span>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/blocky.js"></script>
<script src="js/cast.js"></script>
<script src="js/audio.js"></script>
<script src="js/farm.js"></script>
<script src="js/game.js"></script>
<script src="js/pain.js"></script>
<script src="js/lap-poses.js"></script>
<script src="js/lap.js"></script>
<script src="js/night.js"></script>
<script>
// The night scene (Chapter Two's close) with every camera move turned off: you hold the camera. Esc or P pauses and plays; dialogue advances by itself, or with Space.
(function () {
'use strict';
const $ = id => document.getElementById(id), A = window.GameAudio, THREE = window.THREE, V3 = THREE.Vector3;
const G = window.__game = Game.create({ stage: $('stage'), fade: $('fade'), subs: $('subs'), subWho: $('subWho'), subText: $('subText') });
G.mode = 'free'; G.noSave = true; G.settings.auto = true; G.settings.subtitles = true;

// The story's own camera calls do nothing; fades just take their time.
G.cut = () => {}; G.shot = () => Promise.resolve(); G.fade = (b, s) => G.wait(s || 0);

// Dialogue on the game's clock, so that pausing stops it too.
const WHO = { mother: ['Mother', '#e6b8a0'], jack: ['Jack', '#a8d8a0'], narrator: ['', '#e6c46a'] };
let nudge = false;   // Space: finish the line being typed, then move on from it
G.say = async (who, text, opts) => {
  const w = WHO[who] || [who, '#e6c46a'], cps = 34 * G.settings.speed, typeSecs = Math.max(0.6, text.length / cps);
  $('subWho').textContent = w[0]; $('subWho').style.color = w[1]; $('subs').style.display = 'block'; $('subText').textContent = '';
  const voice = A && who !== 'narrator' ? A.speak(who, text, typeSecs, { muffle: opts && opts.muffle }) : null;
  const t0 = G.t;
  nudge = false;
  while (G.t - t0 < typeSecs && !nudge) { $('subText').textContent = text.slice(0, Math.floor((G.t - t0) * cps)); await G.wait(0.03); }
  $('subText').textContent = text; nudge = false;
  const t1 = G.t, hold = Math.max(1.1, text.length * 0.048 / G.settings.speed);
  while (G.t - t1 < hold && !nudge) await G.wait(0.03);
  nudge = false;
  if (voice && voice.stop) voice.stop(); $('subs').style.display = 'none';
};

// The free camera: the renderer is handed this one instead of the story's.
const fc = new THREE.PerspectiveCamera(50, 1, 0.5, 4000), controls = new THREE.OrbitControls(fc, G.renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
const V = (x, y, z) => new V3(x, y, z);
const HOME = { out: [V(-62, 20, 176), V(4, 14, 100)], in: [V(-14, 24, 38), V(-12, 19, -27)] };
let home = HOME.out;
const goHome = () => { fc.position.copy(home[0]); controls.target.copy(home[1]); controls.update(); };
const render = G.renderer.render.bind(G.renderer);
G.renderer.render = (scene, cam) => {
  const w = G.renderer.domElement.clientWidth || innerWidth, h = G.renderer.domElement.clientHeight || innerHeight;
  if (Math.abs(fc.aspect - w / h) > 1e-3) { fc.aspect = w / h; fc.updateProjectionMatrix(); }
  controls.update(); render(scene, fc);
};
// A new scene (the lane, then the kitchen) puts the camera at that scene's starting view.
const setScene = G.setScene; let n = 0;
G.setScene = w => { setScene(w); home = n++ === 0 ? HOME.out : HOME.in; goHome(); $('where').textContent = n === 1 ? '· outside' : '· inside'; };
goHome();

// Esc / P: pause and play (Space moves the dialogue on). Time stops (the story, the motion, the strokes) and the sound with it.
let paused = false; const realMax = G.maxDt;
const setPaused = p => { paused = p; G.maxDt = p ? 0 : realMax; $('state').textContent = p ? '❚❚' : '▶'; if (A && A.ctx) { try { p ? A.ctx.suspend() : A.ctx.resume(); } catch (e) {} } };
addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === ' ') { e.preventDefault(); nudge = true; }
  else if (e.key === 'r' || e.key === 'R') goHome();
});
$('restart').onclick = () => location.reload();
$('tier').onchange = () => { const q = new URLSearchParams(location.search); q.set('c', $('tier').value); location.search = q.toString(); };

const c = (new URLSearchParams(location.search).get('c') || '0,2,0').split(',').map(Number); $('tier').value = c.join(',');
if (A) { A.init(); }
Night.run(G, c).then(() => { $('subs').style.display = 'none'; $('state').textContent = 'the end'; });
})();
</script>
</body>
</html>
